[build]
  publish = "site"

# Security headers for every page.
# The story video is not set yet, so no outside frames are allowed. When SITE.storyVideoUrl is filled in,
# change frame-src to: frame-src https://www.youtube-nocookie.com https://player.vimeo.com
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Images and fonts never change under the same name: cache them for a year.
# If you replace an image, give the new file a new name.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS keep their names when edited, so browsers re-check them after an hour.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# www goes to the bare domain.
[[redirects]]
  from = "https://www.transformationstudio.site/*"
  to = "https://transformationstudio.site/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.transformationstudio.site/*"
  to = "https://transformationstudio.site/:splat"
  status = 301
  force = true
